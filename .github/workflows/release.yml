# Fork release: a manual, draft-only build of an existing tag on
# main-maintenance. There is no registry GPG key; consumers verify the
# SHA256SUMS digest recorded in the release notes and the build attestations.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag on main-maintenance (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  goreleaser:
    if: github.repository == 'irashack/terraform-provider-netbird' && github.ref == 'refs/heads/main-maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and select release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main-maintenance
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test the tagged source
        run: make test
      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      - name: Generate release attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
      - name: Record checksum manifest digest
        run: |
          echo 'Put this SHA256SUMS digest in the release notes before publishing:' >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*_SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
